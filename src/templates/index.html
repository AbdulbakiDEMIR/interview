<!doctype html>
<html lang="{$LANG.lang}" class="h-100">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{$LANG.title}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column h-100 bg-light">
    <header>
        <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4 shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
                    <i class="bi bi-controller text-warning me-2 fs-4"></i>{$LANG.title}
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                    aria-controls="navbarMain" aria-expanded="false" aria-label="Menü">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarMain">
                    <ul class="navbar-nav ms-auto align-items-md-center">
                        <li class="nav-item">
                            <a class="nav-link" href="/"><i class="bi bi-grid me-1"></i>{$LANG.menu_products}</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/orders"><i class="bi bi-box-seam me-1"></i>{$LANG.menu_orders}</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/balance"><i class="bi bi-wallet2 me-1"></i>{$LANG.menu_balance|default:'Bakiyem'}</a>
                        </li>
                    </ul>
                    <!-- Navbar Dil Seçimi -->
                    <form method="get" action="" class="d-flex align-items-center ms-md-3 mt-2 mt-md-0">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-secondary border-secondary text-white"><i class="bi bi-globe"></i></span>
                            <select name="lang" id="lang" class="form-select form-select-sm bg-dark text-white border-secondary" onchange="this.form.submit()">
                                {foreach $langs as $key => $value}
                                <option value="{$key}" {if $key==$LANG.lang}selected{/if}>{$value}</option>
                                {/foreach}
                            </select>
                        </div>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    {if $error}
    <div class="container">
        <div class="alert alert-danger" role="alert">
            {$error}
        </div>
    </div>
    {/if}

    <main class="flex-shrink-0">
        <div class="container">
            {if $template}
            {include file=$template}
            {/if}
        </div>
    </main>

    <footer class="footer mt-auto py-3 bg-dark text-white-50 border-top border-secondary">
        <div class="container text-center">
            <small>&copy; {$LANG.title} - Tüm Hakları Saklıdır.</small>
        </div>
    </footer>

        <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" id="appModalDialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="appModalTitle">Modal Başlığı</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                    </div>
                    <div class="modal-body" id="appModalBody">
                        <!-- İçerik innerHTML ile dinamik yüklenecek -->
                    </div>
                    <div class="modal-footer" id="appModalFooter">
                        <!-- Butonlar innerHTML ile dinamik yüklenecek -->
                    </div>
                </div>
            </div>
        </div>

        <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
            <div id="appToast" class="toast align-items-center text-white bg-danger border-0" role="alert"
                aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body" id="toastMessage">
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Close"></button>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
            </script>

        <script>
            function showToast(message, type = 'danger') {
                const toastEl = document.getElementById('appToast');
                const toastMsg = document.getElementById('toastMessage');

                if (toastEl && toastMsg) {
                    toastMsg.innerText = message;
                    toastEl.className = 'toast align-items-center text-white border-0 bg-' + type;
                    const toast = bootstrap.Toast.getOrCreateInstance(toastEl);
                    toast.show();
                } else {
                    alert(message);
                }
            }


            function showModal(titleOrOptions, bodyHtml = '', footerHtml = '', size = '') {
                const modalEl = document.getElementById('appModal');
                const titleEl = document.getElementById('appModalTitle');
                const bodyEl = document.getElementById('appModalBody');
                const footerEl = document.getElementById('appModalFooter');
                const dialogEl = document.getElementById('appModalDialog');

                let title = titleOrOptions;
                let body = bodyHtml;
                let footer = footerHtml;
                let modalSize = size;

                if (typeof titleOrOptions === 'object') {
                    title = titleOrOptions.title || '';
                    body = titleOrOptions.body || '';
                    footer = titleOrOptions.footer !== undefined ? titleOrOptions.footer : null;
                    modalSize = titleOrOptions.size || '';
                }

                titleEl.innerHTML = title;
                bodyEl.innerHTML = body;

                if (footer === null || footer === '') {
                    footerEl.innerHTML = '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Kapat</button>';
                } else {
                    footerEl.innerHTML = footer;
                }

                dialogEl.className = 'modal-dialog modal-dialog-centered' + (modalSize ? ' modal-' + modalSize : '');

                const modalInstance = bootstrap.Modal.getOrCreateInstance(modalEl);
                modalInstance.show();
            }

            function hideModal() {
                const modalEl = document.getElementById('appModal');
                if (modalEl) {
                    const modalInstance = bootstrap.Modal.getInstance(modalEl);
                    if (modalInstance) {
                        modalInstance.hide();
                    }
                }
            }
        </script>
    </body>

</html>
