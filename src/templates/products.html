<div class="row">
    <div class="col-auto">
        <select class="form-select" id="games">
            <option value="">{$LANG.select_game}</option>
            {foreach $games as $id => $name}
            <option value="{$id}">{$name}</option>
            {/foreach}
        </select>
    </div>
</div>

<div id="products-page">
    <div id="product-list" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-4 px-2 py-4">
        <div class="w-100 text-center text-muted py-5 d-flex justify-content-center align-items-center">
            <span class="">{$LANG.choose_game}</span>
        </div>
    </div>
</div>


<script>
    document.addEventListener('DOMContentLoaded', function () {
        const gamesSelect = document.getElementById('games');
        const productList = document.getElementById('product-list');


        gamesSelect.addEventListener('change', function () {
            gamesSelect.disabled = true;
            const gameId = this.value;
            productList.innerHTML = ''; // Tabloyu temizle

            if (!gameId) {
                // Kullanıcı seçimi temizlerse, uyarı mesajını tekrar göster
                productList.innerHTML = '<div class="w-100 text-center text-muted py-5 d-flex justify-content-center align-items-center">' +
                    '<span class="">{$LANG.choose_game}</span>' +
                    '</div>';
                gamesSelect.disabled = false;
                return;
            }

            // Kart Şeklinde Skeleton Loading
            let skeletonHtml = '';
            for (let i = 0; i < 6; i++) {
                skeletonHtml += '<div class="col"><div class="card h-100 placeholder-glow border-0 shadow position-relative overflow-hidden">' +
                    '<div class="ratio ratio-1x1 bg-secondary bg-opacity-10 rounded placeholder-glow d-flex align-items-center justify-content-center">' +
                    '<span class="placeholder position-absolute col-6 w-50 h-50 rounded-circle" style="top:50%;left: 50%;transform: translate(-50%, -50%);"></span></div>' +
                    '<div class="card-body d-flex flex-column">' +
                    '<h5 class="card-title mb-1"><span class="placeholder col-8 rounded bg-secondary"></span></h5>' +
                    '<h6 class="card-subtitle mb-3"><span class="placeholder col-4 rounded bg-secondary"></span></h6>' +
                    '<h3 class="card-text mb-4"><span class="placeholder col-6 rounded bg-secondary"></span></h3>' +
                    '<a href="#" tabindex="-1" class="btn btn-sm btn-secondary disabled placeholder px-5 ms-auto" aria-hidden="true"></a>' +
                    '</div></div></div>';
            }
            productList.innerHTML = skeletonHtml;


            fetch('/api/products?game_id=' + gameId)
                .then(response => response.json())
                .then(result => {
                    productList.innerHTML = '';

                    if (result.success && result.data.length > 0) {
                        result.data.forEach(product => {
                            const div = document.createElement('div');
                            div.className = 'col'
                            div.innerHTML =
                                '<div class="card h-100 shadow border-0 position-relative overflow-hidden">' +
                                (product.pre_order ? '<div class="position-absolute m-2 px-4 badge bg-warning fw-bold" style="transform: rotate(45deg); right: -2rem; top: .5rem">{$LANG.pre_order}</div>' : '') +
                                '  <div class="card-header d-flex justify-content-center align-items-center"><i class="bi bi-controller text-primary opacity-75" style="font-size: 8rem;"></i></div>' +
                                '  <div class="card-body d-flex flex-column">' +
                                '    <h5 class="card-title text-primary fw-bold mb-1">' + product.name + '</h5>' +
                                '    <h6 class="card-subtitle mb-3 text-muted small"><i class="bi bi-box-seam me-1"></i>{$LANG.stock}: ' + product.stock + '</h6>' +
                                '    <h3 class="card-text mb-4 text-dark">' + product.price + ' <span class="fs-6 text-muted">TL</span></h3>' +
                                '    <a href="/product/' + gameId + '/' + product.id + '" class="btn btn-sm btn-primary px-5 ms-auto">Detay</a>   ' +
                                '    </div>' +
                                '  </div>' +
                                '</div>';

                            productList.appendChild(div);
                        });
                    } else if (result.success && result.data.length === 0) {
                        productList.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="bi bi-inbox fs-1 d-block mb-3"></i><span class="fs-5">{$LANG.no_products_found}</span></div>';
                    } else {
                        showToast(result.message || '{$LANG.error}', 'danger');
                    }
                })
                .catch(error => {
                    showToast('{$LANG.connection_error}', 'danger');
                    console.error('{$LANG.ajax_error}', error);
                    productList.innerHTML = '<div class="col-12 text-center text-danger py-5"><i class="bi bi-wifi-off fs-1 d-block mb-3"></i><span class="fs-5">{$LANG.connection_error}</span></div>';
                })
                .finally(() => {
                    gamesSelect.disabled = false;
                });
        });
    });
</script>
