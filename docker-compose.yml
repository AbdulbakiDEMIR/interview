version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turkpin_interview_app

    # Portu kendi bilgisayarımda 8080 portundan çalışması için ayarladım.
    # Docker host'undaki 8080 portu, container'daki 80 portuna yönlendirilir.
    ports:
      - "8080:80"

    # Docker'ın host'taki klasörü, container'ın klasörüne bağlar.
    # Böylece değişiklikler anında yansır.
    volumes:
      - .:/var/www/html

    # .env dosyasını container'a aktarır.
    env_file:
      - .env

    # Container'ın otomatik yeniden başlamasını sağlar.
    restart: unless-stopped
